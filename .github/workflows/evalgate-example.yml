# How a project gates its LLM feature on every pull request.
#
# This workflow runs on this repository against examples/support-triage, using the
# action from the local checkout (`uses: ./`). In your own repository use:
#
#     - uses: mourya-dasgupta/evalgate@main   # pin to a release tag once published
#       with:
#         config: evalgate.yaml
#
# Replay mode needs no API keys: model responses come from committed cassettes.
name: EvalGate example

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # only needed for the optional PR comment step

jobs:
  evalgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: EvalGate
        id: evalgate
        uses: ./
        with:
          working-directory: examples/support-triage
          config: evalgate.yaml

      # Optional: post (or update) the Markdown report as a sticky PR comment.
      - name: Comment on the pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.evalgate.outputs.report-md != ''
        uses: actions/github-script@v7
        env:
          REPORT_MD: ${{ steps.evalgate.outputs.report-md }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- evalgate-report -->';
            const body = `${marker}\n${fs.readFileSync(process.env.REPORT_MD, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
