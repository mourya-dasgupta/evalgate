[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "evalgate"
version = "0.1.0"
description = "A regression gate for LLM features: golden-set evals that fail CI when quality drops."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mourya" }]
requires-python = ">=3.11"
keywords = ["llm", "evals", "ci", "regression-testing", "prompt-engineering", "golden-set"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "jinja2>=3.1",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
evalgate = "evalgate.cli:main"

[project.urls]
Homepage = "https://github.com/mourya-dasgupta/evalgate"
Documentation = "https://github.com/mourya-dasgupta/evalgate/blob/main/docs/guide.md"
Changelog = "https://github.com/mourya-dasgupta/evalgate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.hatch.build.targets.sdist]
include = ["src/evalgate", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "RET"]
ignore = [
    "B008",    # typer uses function calls in argument defaults
    "RUF001",  # reports intentionally use unicode symbols (✓ ✗ – →)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001", "RUF003"]
"examples/**" = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["evalgate"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
