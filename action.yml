name: EvalGate
description: Regression gate for LLM features. Replays golden-set evals and fails the PR when quality drops.
author: Mourya
branding:
  icon: shield
  color: green

inputs:
  config:
    description: Path to evalgate.yaml, relative to working-directory.
    default: evalgate.yaml
  working-directory:
    description: Directory to run EvalGate in.
    default: "."
  suite:
    description: Space-separated suite names to gate (default is all suites).
    default: ""
  mode:
    description: replay (default, no API keys), record or live.
    default: replay
  python-version:
    description: Python version to install.
    default: "3.12"
  evalgate-version:
    description: >-
      pip requirement for EvalGate (e.g. "evalgate==0.1.0"). Empty installs the
      version of EvalGate that ships with this action.
    default: ""
  report-name:
    description: Name of the uploaded report artifact.
    default: evalgate-report
  fail-on-gate:
    description: Fail the job when the gate fails ("true"/"false").
    default: "true"

outputs:
  verdict:
    description: PASS, FAIL or NO_BASELINE (empty if the gate could not run).
    value: ${{ steps.gate.outputs.verdict }}
  exit-code:
    description: "evalgate exit code: 0 pass, 1 gate failed, 2 config error, 3 provider/cassette error."
    value: ${{ steps.gate.outputs.exit-code }}
  report-md:
    description: Path to the Markdown report (suitable for a PR comment).
    value: ${{ steps.gate.outputs.report-md }}
  report-html:
    description: Path to the self-contained HTML report.
    value: ${{ steps.gate.outputs.report-html }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install EvalGate
      shell: bash
      env:
        EVALGATE_SPEC: ${{ inputs.evalgate-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --disable-pip-version-check --quiet --upgrade pip
        if [ -n "$EVALGATE_SPEC" ]; then
          python -m pip install --disable-pip-version-check --quiet "$EVALGATE_SPEC"
        else
          python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"
        fi
        evalgate --version

    - name: Run evalgate gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EVALGATE_CONFIG: ${{ inputs.config }}
        EVALGATE_MODE: ${{ inputs.mode }}
        EVALGATE_SUITES: ${{ inputs.suite }}
        REPORT_DIR: ${{ runner.temp }}/evalgate
      run: |
        mkdir -p "$REPORT_DIR"
        args=()
        for s in $EVALGATE_SUITES; do args+=(--suite "$s"); done
        set +e
        evalgate --config "$EVALGATE_CONFIG" gate "${args[@]}" \
          --report-md "$REPORT_DIR/evalgate-report.md" \
          --report-html "$REPORT_DIR/evalgate-report.html" \
          --report-json "$REPORT_DIR/evalgate-report.json"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$REPORT_DIR/evalgate-report.json" ]; then
          verdict=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['verdict'])" "$REPORT_DIR/evalgate-report.json")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "report-md=$REPORT_DIR/evalgate-report.md" >> "$GITHUB_OUTPUT"
          echo "report-html=$REPORT_DIR/evalgate-report.html" >> "$GITHUB_OUTPUT"
          cat "$REPORT_DIR/evalgate-report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "## EvalGate: could not evaluate the gate (exit code $code)"
            echo
            echo "Exit code 2 = configuration error, 3 = provider/cassette error. See the job log for details."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-name }}
        path: ${{ runner.temp }}/evalgate/
        if-no-files-found: ignore

    - name: Enforce gate
      if: inputs.fail-on-gate == 'true'
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.exit-code }}
      run: |
        if [ "$CODE" != "0" ]; then
          echo "::error title=EvalGate::gate did not pass (exit code $CODE). See the job summary and the HTML report artifact."
          exit "$CODE"
        fi
